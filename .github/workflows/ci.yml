name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - docs/**
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      # Contract drift-check (#447): regenerate API types from the committed
      # OpenAPI snapshots and fail if the committed generated types differ.
      # Catches hand-edits and openapi-typescript version drift. Offline:
      # generates from src/types/generated/*.openapi.json, no backend needed.
      - run: npm run gen:api-types
      - run: git diff --exit-code -- src/types/generated/auditor.ts src/types/generated/pipeline.ts
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:e2e:typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'workflow_dispatch'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
